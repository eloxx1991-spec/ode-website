<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Münzgespeiste Kinderfahrgeschäfte zu kaufen. Über 500 Stück verfügbar. Elefanten, Oldtimer, Quads, Raketen & mehr. Ab 100 €.">
  <title>Kiddy Rider Spielgeräte — Über 500 Fahrgeschäfte kaufen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* === COLORS === */
    :root {
      --gold: #C89B3C;
      --cream: #F5EDD8;
      --light-grey: #F4F4F4;
      --dark: #1C1C1C;
      --white: #FFFFFF;
    }

    /* === RESET & BASE === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      color: #1C1C1C;
      line-height: 1.6;
    }

    /* === TYPOGRAPHY === */
    h1, h2, h3 { font-family: 'Playfair Display', serif; line-height: 1.2; }

    /* === LAYOUT === */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* === HERO === */
    .hero {
      position: relative;
      min-height: 100vh;
      background-color: var(--dark); /* fallback if image fails */
      background-image: url('assets/images/elefant-fahrt-grau-gross.jpeg');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .hero-title {
      font-size: clamp(2rem, 5vw, 4rem);
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .hero-sub {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--white);
      max-width: 600px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <h1 class="hero-title">Der Zauber des kleinen Augenblicks</h1>
      <p class="hero-sub">Über 500 Kiddy Rider — bereit für ihr nächstes Abenteuer</p>
    </div>
  </section>

</body>
</html>
